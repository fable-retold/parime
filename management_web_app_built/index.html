<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<meta name="description" content="Parime Data Lake Management Console">

		<title>Parime Management Console</title>

		<!-- Favicons (generated by `npm run brand`) -->
		<link rel="icon" type="image/svg+xml" href="favicons/favicon.svg">
		<link rel="icon" type="image/svg+xml" href="favicons/favicon-light.svg" media="(prefers-color-scheme: light)">
		<link rel="icon" type="image/svg+xml" href="favicons/favicon-dark.svg"  media="(prefers-color-scheme: dark)">

		<!-- Application Stylesheet -->
		<link href="css/parime-management.css" rel="stylesheet">
		<!-- PICT Dynamic View CSS Container -->
		<style id="PICT-CSS"></style>

		<!-- Load the PICT library -->
		<script src="./js/pict.min.js" type="text/javascript"></script>
		<!-- Bootstrap the Application -->
		<script type="text/javascript">
//<![CDATA[
		Pict.safeOnDocumentReady(() => { Pict.safeLoadPictApplication(ParimeManagement, 2)});
//]]>
		</script>
	</head>
	<body>
		<!-- The root container for the Pict application -->
		<div id="ParimeManagement-Application-Container"></div>

		<!-- Load the Parime Management PICT Application Bundle -->
		<script src="./parime-management.min.js" type="text/javascript"></script>
	</body>
</html>
